<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>mirrorsky — Personal Site</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body id="body">
  <a href="#main" id="skip-link" class="skip-link">Skip to main content</a>
  <div class="crt-overlay" aria-hidden="true"></div>

  <header class="site-header">
    <nav aria-label="Primary">
      <a href="#about" class="nav-item" data-section="about">ABOUT</a>
      <a href="#projects" class="nav-item" data-section="projects">PROJECTS</a>
      <a href="#contact" class="nav-item" data-section="contact">CONTACT</a>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <section class="hero" aria-label="Welcome">
      <div class="avatar-container">
        <div class="pixel-avatar" aria-hidden="true">
          <div class="head"></div>
          <div class="skin-1"></div>
          <div class="skin-2"></div>
          <div class="eye-l"></div>
          <div class="eye-r"></div>
          <div class="mouth"></div>
          <div class="cheek-l"></div>
          <div class="cheek-r"></div>
        </div>
      </div>

      <div class="hero-copy">
        <header class="site-header-main">
          <h1 class="blink-text">mirrorsky</h1>
        </header>
      </div>
    </section>

    <section id="about" class="section" aria-labelledby="about-heading">
      <h2 id="about-heading">About Me</h2>
      <div class="about-content"></div>
    </section>

    <section id="projects" class="section projects-section" aria-labelledby="projects-heading">
      <h2 id="projects-heading" class="section-title">My Projects</h2>

      <div class="project-grid">
        <article class="project-card" aria-labelledby="proj1">
          <div class="card-image">
            <img src="images/1.png" alt="AI artwork">
          </div>
          <h3 id="proj1"></h3>
        </article>

        <article class="project-card" aria-labelledby="proj2">
          <div class="card-image">
            <img src="images/2.png" alt="AI artwork">
          </div>
          <h3 id="proj2"></h3>
        </article>

        <article class="project-card" aria-labelledby="proj3">
          <div class="card-image">
            <img src="images/3.png" alt="AI artwork">
          </div>
          <h3 id="proj3"></h3>
        </article>

        <article class="project-card" aria-labelledby="proj4">
          <div class="card-image">
            <img src="images/4.png" alt="AI artwork">
          </div>
          <h3 id="proj4"></h3>
        </article>

        <article class="project-card" aria-labelledby="proj5">
          <div class="card-image">
            <img src="images/5.png" alt="AI artwork">
          </div>
          <h3 id="proj5"></h3>
        </article>
    </section>

    <section id="contact" class="section contact-section" aria-labelledby="contact-heading">
      <h2 id="contact-heading">Get in Touch</h2>
      <div class="contact-content"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© mirrorsky</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
